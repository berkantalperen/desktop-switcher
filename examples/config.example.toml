# desktop-switcher configuration — SCHEMA EXAMPLE
#
# Do not copy this into place and fill in plausible-looking values. Run
#
#     desktop-switcher configure
#
# which discovers your monitors and writes the real file. Every `REPLACE_...`
# below has to come from that discovery.
#
# Each computer keeps its own file: connection ids differ between machines,
# and so can input codes, because a code names the monitor's socket, not the
# computer plugged into it.

schema_version = 2

# A name for this computer. Free-form; only used in output and logs.
host = "REPLACE_WITH_HOST_NAME"

# "windows" (Windows' own DDC/CI API) or "ddcutil-cli" (Linux). "fake" gives
# in-memory monitors that touch no hardware. The old "powertoys-cli" is still
# accepted and means "windows".
backend = "windows"

# Linux only: pin the ddcutil executable instead of searching PATH.
# tool_path = "/usr/bin/ddcutil"

# Seconds before a backend command is killed (ddcutil).
timeout_seconds = 15

# Milliseconds to wait after a write before reading it back.
settle_ms = 1200

# Repeats of the same request inside this window are ignored, so a held-down
# hotkey does not issue a burst of writes.
dedupe_ms = 1500


[[monitors]]
# The name used on the command line. `configure` uses the EDID serial.
key = "REPLACE_AFTER_DISCOVERY"
# A friendlier name; the command line accepts either.
label = "left"

# The backend's handle for the connection, recorded by `configure`. On Windows
# a device path, on Linux a DRM connector such as "card1-DP-4". It names the
# *cable*, so it changes if you move one, and the tool then refuses until you
# re-run `configure`.
backend_id = "REPLACE_AFTER_DISCOVERY"

# The EDID serial names the *monitor*, and is what a binding is checked
# against. A monitor with no serial is bound by connection alone, with a
# warning every time.
serial = "REPLACE_AFTER_DISCOVERY"
model = "REPLACE_AFTER_DISCOVERY"

[[monitors.inputs]]
# The monitor's own VCP 0x60 value, always with an explicit 0x: a bare `11`
# is rejected, because decimal 11 is 0x0B and the wrong input is expensive.
input_code = "0x11"
# Whatever this input means to you. The tray offers only inputs given a name
# other than their standard one ("HDMI-1"), since unnamed ones are usually
# sockets the monitor merely claims to have.
label = "Laptop"
# What is known about this input: unknown, reported, read-confirmed,
# write-confirmed or user-confirmed. `configure` records what the monitor
# claims as `reported`. Informational only; switching never depends on it.
verification = "reported"

[[monitors.inputs]]
input_code = "0x0F"
label = "Workstation"
verification = "reported"


# An action is a named list of steps, run in order, stopping at the first that
# fails. A hotkey is optional: modifiers (CTRL, ALT, SHIFT, WIN) plus one key,
# such as "CTRL+ALT+2", "F24" or "SHIFT+F24". On Windows the tray icon
# registers them; on GNOME, run scripts/install-gnome-shortcuts.sh.
[[actions]]
name = "Workstation"
hotkey = "CTRL+ALT+2"

# Set one monitor to one input. Repeat for each monitor: every monitor is its
# own mapping, and nothing assumes two monitors use the same codes.
[[actions.steps]]
kind = "set-input"
monitor = "left"
code = "0x0F"

# Flip a monitor between two inputs: the second if it reports the first, the
# first otherwise. Only ever one of the two.
[[actions]]
name = "Toggle left"
hotkey = "F24"

[[actions.steps]]
kind = "toggle-input"
monitor = "left"
between = ["0x11", "0x0F"]

# Run any program. Arguments are a list and never pass through a shell.
# [[actions.steps]]
# kind = "run"
# command = "ssh"
# args = ["workstation", "wake-screens"]

# Also available: "sweep" and "restore-windows" (move this computer's windows
# off a monitor and back), each with an optional `monitor`.
